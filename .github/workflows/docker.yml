name: Containers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cpu-images-and-smoke:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: compose.yml:compose.ci.yml
      APP_ENV: test
      ALLOW_HEURISTIC_ANALYZER: "true"
      REQUIRE_MODELS_FOR_READINESS: "false"
      POSTGRES_PASSWORD: compose-test-postgres
      DATABASE_URL: postgresql+psycopg://portrait:compose-test-postgres@postgres:5432/portrait_transfer
      MINIO_ROOT_PASSWORD: compose-test-minio
      S3_SECRET_ACCESS_KEY: compose-test-minio
      SESSION_SECRET: compose-test-session-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU images
        run: docker compose build web api ai-engine worker-cpu caddy
      - name: Scan application images
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-api
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-web
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-worker-cpu
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan AI contract image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-ai-engine
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan proxy image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-caddy
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Apply database migrations
        run: docker compose run --rm api alembic -c services/api/alembic.ini upgrade head
      - name: Start stack and wait
        run: docker compose up -d --wait --wait-timeout 240 postgres redis minio minio-init api worker-cpu web caddy
      - name: API readiness smoke
        run: python scripts/smoke_stack.py --url http://localhost:8000/api/v1/health/ready
      - name: Full synthetic job smoke
        run: python scripts/smoke_job.py --url http://localhost:8000/api/v1 --timeout 300
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down --volumes --remove-orphans

  production-ai-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production CUDA AI image
        run: docker compose build ai-engine
      - name: Scan production AI image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-ai-engine
          format: sarif
          output: trivy-ai-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-ai-results.sarif') != ''
        with:
          sarif_file: trivy-ai-results.sarif
          category: production-ai-image
      - name: Generate production AI SBOM
        if: always()
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: portrait-style-transfer-ai-engine
          format: cyclonedx
          output: ai-engine.cdx.json
      - name: Upload production AI SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ai-engine-sbom
          path: ai-engine.cdx.json
          if-no-files-found: error
      - name: Explain runtime boundary
        run: echo 'Build, vulnerability scan, and SBOM passed; real CUDA inference still requires a separate GPU runner.'
