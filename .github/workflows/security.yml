name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Audit locked Python dependency exports
        run: |
          uv export --project packages/portrait_transfer --frozen --format requirements-txt --no-hashes --output-file /tmp/package-requirements.txt
          uv export --project services/api --frozen --format requirements-txt --no-hashes --output-file /tmp/api-requirements.txt
          uv export --project services/worker --frozen --format requirements-txt --no-hashes --output-file /tmp/worker-requirements.txt
          cp services/ai_engine/requirements.txt /tmp/ai-engine-requirements.txt
          printf '%s\n' 'torch==2.10.0+cu128' 'torchvision==0.25.0+cu128' 'insightface==1.0.1' >> /tmp/ai-engine-requirements.txt
          uv tool run pip-audit -r /tmp/package-requirements.txt
          uv tool run pip-audit -r /tmp/api-requirements.txt
          uv tool run pip-audit -r /tmp/worker-requirements.txt
          uv tool run pip-audit --extra-index-url https://download.pytorch.org/whl/cu128 -r /tmp/ai-engine-requirements.txt
