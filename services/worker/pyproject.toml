[project]
name = "portrait-style-worker"
version = "0.1.0"
description = "Celery workers for portrait style transfer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.40",
  "celery==5.5.3",
  "mediapipe==0.10.31",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "prometheus-client==0.23.1",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "portrait-style-api",
  "portrait-transfer",
]

[project.optional-dependencies]
gpu = ["portrait-transfer[gpu]"]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-mock==3.15.1",
  "ruff==0.13.2",
]

[tool.uv.sources]
portrait-style-api = { path = "../api", editable = true }
portrait-transfer = { path = "../../packages/portrait_transfer", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/portrait_worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "celery",
  "celery.*",
  "kombu",
  "kombu.*",
  "mediapipe",
  "mediapipe.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true
