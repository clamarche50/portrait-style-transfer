[project]
name = "portrait-style-api"
version = "0.1.0"
description = "FastAPI service for the portrait style transfer application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.40.40",
  "celery==5.5.3",
  "fastapi==0.133.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "numpy==2.2.6",
  "pillow==12.3.0",
  "prometheus-client==0.23.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.31",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.36.0",
  "portrait-transfer",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-mock==3.15.1",
  "ruff==0.13.2",
]

[tool.uv.sources]
portrait-transfer = { path = "../../packages/portrait_transfer", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/portrait_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/portrait_api/api/v1/routes/*.py" = ["B008"]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "celery",
  "celery.*",
  "kornia",
  "scipy",
  "scipy.*",
  "torch",
  "torch.*",
]
ignore_missing_imports = true
