name: portrait-style-transfer

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
  EXPOSE_METRICS: ${EXPOSE_METRICS:-false}
  RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-true}
  APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portrait:portrait-dev-only@postgres:5432/portrait_transfer}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-portrait-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-portrait-minio-dev-only}
  S3_BUCKET: ${S3_BUCKET:-portrait-private}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-none}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
  ASSET_TTL_HOURS: ${ASSET_TTL_HOURS:-24}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
  MAX_DECODED_PIXELS: ${MAX_DECODED_PIXELS:-8000000}
  MAX_ORIGINAL_LONG_EDGE: ${MAX_ORIGINAL_LONG_EDGE:-8000}
  MAX_SESSION_UPLOAD_BYTES_24H: ${MAX_SESSION_UPLOAD_BYTES_24H:-104857600}
  MAX_ASSETS_PER_SESSION: ${MAX_ASSETS_PER_SESSION:-100}
  MAX_CONCURRENT_JOBS_PER_USER: ${MAX_CONCURRENT_JOBS_PER_USER:-2}
  # Must exceed the AI HTTP timeout plus object I/O and durable finalization.
  WORKER_TASK_TIME_LIMIT_SECONDS: ${WORKER_TASK_TIME_LIMIT_SECONDS:-900}
  MAX_JOB_CACHE_BYTES: ${MAX_JOB_CACHE_BYTES:-536870912}
  RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
  RATE_LIMIT_UPLOADS_PER_HOUR: ${RATE_LIMIT_UPLOADS_PER_HOUR:-20}
  RATE_LIMIT_JOBS_PER_HOUR: ${RATE_LIMIT_JOBS_PER_HOUR:-30}
  REDIS_PROGRESS_TTL_SECONDS: ${REDIS_PROGRESS_TTL_SECONDS:-172800}
  JOB_LOCK_TTL_SECONDS: ${JOB_LOCK_TTL_SECONDS:-3600}
  MODEL_DIR: /app/models
  FACE_LANDMARKER_MODEL: face_landmarker.task
  IMAGE_SEGMENTER_MODEL: selfie_multiclass_256x256.tflite
  REQUIRE_MODELS_FOR_READINESS: ${REQUIRE_MODELS_FOR_READINESS:-true}
  DEFAULT_ALGORITHM_PROFILE: ai_dgpst_v1
  ENABLE_SOURCE_COMPAT_PROFILE: ${ENABLE_SOURCE_COMPAT_PROFILE:-false}
  DENSE_ALIGNMENT_DEVICE: ${DENSE_ALIGNMENT_DEVICE:-cpu}
  ALLOW_HEURISTIC_ANALYZER: ${ALLOW_HEURISTIC_ANALYZER:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:3000}
  SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE_OVERRIDE: ${COOKIE_SECURE_OVERRIDE:-true}
  SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-analysis-model-volumes: &analysis-model-volumes
  - type: bind
    source: ./models/manifest.json
    target: /app/models/manifest.json
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ./models/face_landmarker.task
    target: /app/models/face_landmarker.task
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ./models/selfie_multiclass_256x256.tflite
    target: /app/models/selfie_multiclass_256x256.tflite
    read_only: true
    bind:
      create_host_path: false

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portrait_transfer}
      POSTGRES_USER: ${POSTGRES_USER:-portrait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portrait-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portrait-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portrait-minio-dev-only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portrait-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portrait-minio-dev-only}
      S3_BUCKET: ${S3_BUCKET:-portrait-private}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes: *analysis-model-volumes
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    networks: [frontend, backend]

  ai-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai-engine
      args:
        DGPST_COMMIT: aada535bde5b87f9ece9a4af1c0628a93f46a342
    environment:
      DGPST_MODEL_ROOT: /models/dgpst
      DGPST_MANIFEST_PATH: /models/dgpst/manifest.json
      DGPST_UPSTREAM_ROOT: /opt/dgpst
      DGPST_DEVICE: cuda
      DGPST_DTYPE: float16
      DGPST_MAX_LONG_SIDE: ${DGPST_MAX_LONG_SIDE:-768}
      DGPST_VERIFY_MODELS: "true"
      AI_ENGINE_API_TOKEN: ${AI_ENGINE_API_TOKEN:-}
      # The API rejects normalized images that exceed the same 15 MiB bound,
      # so the private sidecar never needs a wider request allowance.
      MAX_UPLOAD_BYTES: ${AI_ENGINE_MAX_UPLOAD_BYTES:-15728640}
      MAX_DECODED_PIXELS: ${MAX_DECODED_PIXELS:-8000000}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DIFFUSERS_OFFLINE: "1"
    volumes:
      - ./models/dgpst:/models/dgpst:ro
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    shm_size: 1g
    mem_limit: ${AI_ENGINE_MEMORY_LIMIT:-10g}
    gpus: all
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    stop_grace_period: 45s
    restart: unless-stopped
    networks: [backend]

  worker-cpu:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker-cpu
    environment:
      <<: *app-environment
      ENABLE_GPU: "false"
      DENSE_ALIGNMENT_DEVICE: cpu
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8010}
      AI_ENGINE_REQUEST_TIMEOUT_SECONDS: ${AI_ENGINE_REQUEST_TIMEOUT_SECONDS:-600}
      AI_ENGINE_API_TOKEN: ${AI_ENGINE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    volumes: *analysis-model-volumes
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    mem_limit: ${WORKER_MEMORY_LIMIT:-5g}
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend, egress]

  worker-gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker-gpu
    environment:
      <<: *app-environment
      ENABLE_GPU: "true"
      DENSE_ALIGNMENT_DEVICE: cuda
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes: *analysis-model-volumes
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    mem_limit: ${WORKER_MEMORY_LIMIT:-5g}
    gpus: all
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend, egress]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [frontend]

  caddy:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.caddy
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:8080"
      - "${CADDY_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true
  # Queue workers need outbound access for explicitly configured managed S3 or
  # OTLP endpoints. No service publishes a host port on this network.
  egress:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
