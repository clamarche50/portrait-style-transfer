services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

secrets:
  cloudflare_tunnel_token:
    file: ./.cloudflare-tunnel-token