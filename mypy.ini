[mypy]
python_version = 3.12
strict = True
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/portrait_transfer/src, services/api/app, services/worker/app

[mypy-boto3]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-kombu]
ignore_missing_imports = True

[mypy-kombu.*]
ignore_missing_imports = True

[mypy-kornia]
ignore_missing_imports = True

[mypy-mediapipe]
ignore_missing_imports = True

[mypy-mediapipe.*]
ignore_missing_imports = True

[mypy-scipy]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-torch]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True
